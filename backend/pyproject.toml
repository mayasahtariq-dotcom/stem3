[project]
name = "aaroh-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic-settings", "httpx", "sqlalchemy>=2", "alembic", "psycopg[binary]", "pyjwt"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-xdist", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
